<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Forms</h1>
    <div>
      <form action="formwelcome.html" target="_blank">

        <fieldset>
            <legend>Enter your details</legend>

        <label for="fullName">Full name:</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your name"
          required
        />
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter email"
        required />
        <br><br>
        
        <label for="passWord">Password:</label>
        <input
          type="password"
          id="passWord"
          placeholder="Enter 8 digit password"
          required
        />
        <br /><br />

        <label for="checkBox">Are you 18 above?</label>
        <input type="checkbox" id="checkBox">
        <br><br>

        <label for="age">Enter you age:</label>
        <input type="number" id="age" placeholder="Enter your age" min="1">
        <br><br>

        <label for="mobile">Enter you mobile:</label>
        <input type="tel" id="mobile" placeholder="Enter your mobile no." required 
        maxlength="10">
        <br><br>

        <label for="gender">Gender:</label>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender">
        <br><br>

        <label for="date">Enter D.O.B:</label>
        <input type="date" id="date">
        <br><br>

        <label for="file">Upload file:</label>
        <input type="file" id="file">
        <br><br>

        <label for="state">Select your State:</label>
        <select name="" id="state">
        <option >Punjab</option>
        <option >Uttar Pardesh<option>
        <option >Uttrakhand</option>
        <option >J&K</option>
        <option >Rajasthan</option>
        <option >Haryana</option>
        <option >Assam</option>
        </select> 
        <br><br>

        <button style="background-color: aqua;">Submit form</button>

        </fieldset>
      </form>
    </div>
  </body>
</html>
