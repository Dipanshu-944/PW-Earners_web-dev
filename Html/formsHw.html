<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pete's Pizza Delivery</title>
    <link rel="stylesheet" href="formsHw.css" />
  </head>
  <body>
    <div style="width: 800px; margin: auto" class="mainbody">
      
      <h1 style="margin-left: 250px">Pete's Pizza Delivery</h1>
        <h3 style="margin-left: 300px">Online Order Form</h3>

      <form action="formwelcome.html" target="_blank">
        
        <fieldset>
          <legend><strong>Customers Details</strong></legend>

          <label for="fullName"><strong>Fullname:</strong></label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your name"
            required
          />
          <br /><br />

          <label for="address"><strong>Address:</strong></label>
          <input
            type="text"
            id="address"
            placeholder="Enter your address"
            required
          /><br /><br />

          <label for="city"><strong>Town/City:</strong></label>
          <input
            type="text"
            id="city"
            placeholder="Enter your city"
            required
          /><br /><br />

          <label for="postcode"><strong>Postcode:</strong></label>
          <input
            type="number"
            min="00"
            id="postcode"
            placeholder="Enter your pincode"
            required
          /><br /><br />

          <label for="phone"><strong>Tel:</strong></label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your mobile no."
            required
          /><br /><br />

          <label><strong>Email:</strong></label>
          <input
            type="email"
            id="fullName"
            placeholder="Enter your email(optional)"
          /><br /><br />
        </fieldset>

        <div class="container">
          <fieldset>
            <legend><strong>Topping</strong></legend>

            <input
              type="radio"
              id="margherita"
              name="topping"
              value="Margherita"
              style="width: 100px"
            />
            <label for="margherita">Margherita</label><br />

            <input
              type="radio"
              id="fourseasons"
              name="topping"
              value="Four Seasons"
              style="width: 100px"
            />
            <label for="fourseasons">Four Seasons</label><br />

            <input
              type="radio"
              id="meatfeast"
              name="topping"
              value="Meat Feast"
              style="width: 100px"
            />
            <label for="meatfeast">Meat Feast</label>
          </fieldset>

          <fieldset>
            <legend><strong>Size</strong></legend>

            <input
              type="radio"
              id="small"
              name="size"
              value="Small"
              style="width: 100px"
            />
            <label for="small">Small</label><br />

            <input
              type="radio"
              id="medium"
              name="size"
              value="Medium"
              style="width: 100px"
            />
            <label for="medium">Medium</label><br />

            <input
              type="radio"
              id="large"
              name="size"
              value="Large"
              style="width: 100px"
            />
            <label for="large">Large</label>
          </fieldset>

          <fieldset>
            <legend><strong>Extras</strong></legend>

            <input
              type="checkbox"
              id="cheese"
              name="extras"
              value="Extra Cheese"
              style="width: 100px"
            />
            <label for="cheese">Extra Cheese</label><br />

            <input
              type="checkbox"
              id="corn"
              name="extras"
              value="Corn"
              style="width: 100px"
            />
            <label for="corn">Corn</label><br />

            <input
              type="checkbox"
              id="pepper"
              name="extras"
              value="Green Pepper"
              style="width: 100px"
            />
            <label for="pepper">Green Pepper</label><br />

            <input
              type="checkbox"
              id="mushroom"
              name="extras"
              value="Mushrooms"
              style="width: 100px"
            />
            <label for="mushroom">Mushrooms</label>
          </fieldset>
        </div>

        <fieldset>
          <legend><strong>Delivery</strong></legend>

          <label for="time" style="width: 200px"
            ><strong>Preferred delivery time:</strong></label
          >
          <input type="time" style="width: 100px" />
          <br /><br />

          <label for="instruct" style="width: 200px"
            ><strong>Delivery Instructions:</strong></label
          ><br /><br />
          <textarea
            name="message"
            id="instruct"
            placeholder="Enter your instructions"
            rows="5"
            cols="100"
          ></textarea>
        </fieldset>
        <br /><br />

        <button
          style="
            margin-left: 325px;
            cursor: pointer;
            background-color: brown;
            text-align: center;
            width: 100px;
            height: 50px;
            color: white;
          "
        >
          Submit Order
        </button>
      </form>
    </div>
  </body>
</html>
