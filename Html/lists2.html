<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested lists</title>
  </head>
  <body>
    <ol>
      <li>Fruits</li>
      <ol>
        <li>Mango</li>
        <li>Orange</li>
      </ol>

      <li>Vegetables</li>

      <ol>
        <li>cabbage</li>
        <li>capsicum</li>
        <ul type="disc">
          <li>Green capsicum</li>
          <li>Yellow capsicum</li>
          <li>Red capsicum</li>
        </ul>
      </ol>
    </ol>
  </body>
</html>
