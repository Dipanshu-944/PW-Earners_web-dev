<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Hw</title>
    <style>
      table,
      tr,
      td,
      th {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <div>
      <table>
        <tr>
          <th rowspan="3">Day</th>
          <th colspan="5">Seminar</th>
        </tr>
        <tr>
          <th colspan="2">Schedule</th>

          <th colspan="3" rowspan="2">Topic</th>
        </tr>
        <tr>
          <th>Begin</th>
          <th>End</th>
        </tr>
        <tr>
          <td rowspan="2">Monday</td>
          <td rowspan="2">8.00 a.m</td>
          <td rowspan="2">5.00 p.m</td>
          <td colspan="3">Introduction to XML</td>
        </tr>
        <tr>
          <td colspan="3">Validity DTD and relax NG</td>
        </tr>
        <tr>
          <td rowspan="4">Tuesday</td> <!-- so to do fill 1.5 cell we need to make 4 cells for tues and give span to neighbour cells and then give padding to xpath to adjust px and cover that space in video lecture 6 at 45 mins-->
          <td>8.00 a.m</td>
          <td>11.00 a.m</td>
          <td rowspan="2" style="padding: 7px">Xpath</td>
        </tr>
        <tr>
          <td rowspan="2">11.00 a.m</td>
          <td rowspan="2">2.00 p.m</td>
        </tr>
        <tr>
            <td rowspan="2">XSL transformations</td>
        </tr>
        <tr>
          <td>2.00 p.m</td>
          <td>5.00 p.m</td>
        </tr>
        <tr>
          <td>Wednesday</td>
          <td>8.00 a.m</td>
          <td>12.00 p.m</td>
          <td colspan="3">XSL formatting objects</td>
        </tr>
      </table>
    </div>
  </body>
</html>
