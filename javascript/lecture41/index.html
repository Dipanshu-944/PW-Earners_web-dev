<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <h1>hi lecture 41</h1>
    <form action="" id="form">
        <div>
            <label for="name">Name: </label>
            <input type="text" id="name" placeholder="Enter your name">
            <span id="error-message"></span>
        </div>
        <div>
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div>
            <label for="password">Password: </label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <p id="pass-hint" class="hidden">Must be atleast 8 character</p>
        <div>
            <label for="bio">Bio: </label>
            <textarea name="bio" id="bio" placeholder="enter you info...."></textarea>
            <p id="char-count">150 words remaining</p>
        </div>
        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terms and conditions</label>
        </div>
        <div>
            <label for="country">
                Select your country:
            </label>
            <select name="country" id="country">
                <option value="India">India</option>
                <option value="Nepal">Nepal</option>
                <option value="Japan">Japan</option>
                <option value="England">England</option>
            </select>
        </div>
        <button type="submit" id="btn"> Login </button>
    </form>

    <script src="index.js"></script>
</body>
</html>
